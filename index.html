<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="css/style.css" rel="stylesheet"/>
    <link href="css/responsive.css" rel="stylesheet"/>
    <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          referrerpolicy="no-referrer" rel="stylesheet"/>
    <script defer src="script.js" type="module"></script>
    <title>Allociné</title>
</head>
<body>
<header>
    <div id="container">
        <i class="fa-solid fa-film"></i>
        <nav>
            <ul>
                <li><a href="#">Films</a></li>
                <li><a href="#">Séries</a></li>
                <li><a href="#">Populaires</a></li>
            </ul>
        </nav>
    </div>
</header>
<main>
    <section id="recherche">
        <form id="search-form">
            <input id="search-input" placeholder="Rechercher un film ou une série..." type="search"/>
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
    </section>

    <section id="search-results">
        <div id="search-grid"></div>
    </section>
    <section id="tendances">
        <div class="section-header">
            <h2>Tendances</h2>
            <div class="filtres">
                <button class="filtre actif"
                        data-url="https://api.themoviedb.org/3/trending/all/day?api_key=33a0dd3dbdda91ac44cfa3af14f24f03&language=fr-FR">
                    Aujourd'hui
                </button>
                <button class="filtre"
                        data-url="https://api.themoviedb.org/3/trending/all/week?api_key=33a0dd3dbdda91ac44cfa3af14f24f03&language=fr-FR">
                    Cette semaine
                </button>
            </div>
        </div>
        <div id="actuTendances"></div>
    </section>

    <section id="series">
        <div class="section-header">
            <h2>Séries TV</h2>
            <div class="filtres">
                <button class="filtre actif"
                        data-url="https://api.themoviedb.org/3/tv/top_rated?api_key=33a0dd3dbdda91ac44cfa3af14f24f03&language=fr-FR">
                    Mieux notées
                </button>
                <button class="filtre"
                        data-url="https://api.themoviedb.org/3/tv/popular?api_key=33a0dd3dbdda91ac44cfa3af14f24f03&language=fr-FR">
                    Populaires
                </button>
            </div>
        </div>
        <div id="series-grid"></div>
    </section>

    <section id="films">
        <div class="section-header">
            <h2>Films</h2>
            <div class="filtres">
                <button class="filtre actif"
                        data-url="https://api.themoviedb.org/3/movie/now_playing?api_key=33a0dd3dbdda91ac44cfa3af14f24f03&language=fr-FR">
                    En ce moment
                </button>
                <button class="filtre"
                        data-url="https://api.themoviedb.org/3/movie/popular?api_key=33a0dd3dbdda91ac44cfa3af14f24f03&language=fr-FR">
                    Populaires
                </button>
                <button class="filtre"
                        data-url="https://api.themoviedb.org/3/movie/top_rated?api_key=33a0dd3dbdda91ac44cfa3af14f24f03&language=fr-FR">
                    Mieux notés
                </button>
            </div>
        </div>
        <div id="films-grid"></div>
    </section>
</main>

</body>
</html>
